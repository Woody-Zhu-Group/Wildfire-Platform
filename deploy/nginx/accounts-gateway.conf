# Include this server in the existing HTTPS origin configuration.
# Only the trusted CloudFront origin path may reach this server.
# Accounts and business service ports must not be exposed to the public.
server {
    listen 127.0.0.1:8080;
    server_name _;
    access_log off;
    error_log /dev/null;
    client_max_body_size 16k;
    proxy_read_timeout 90s;

    location /auth/ {
        proxy_pass http://127.0.0.1:8005;
        include /etc/nginx/wildfire/accounts-proxy.conf;
    }
    location /api/auth/ {
        proxy_pass http://127.0.0.1:8005;
        include /etc/nginx/wildfire/accounts-proxy.conf;
    }
    location /api/access-requests {
        proxy_pass http://127.0.0.1:8005;
        include /etc/nginx/wildfire/accounts-proxy.conf;
    }
    location /api/invitations/ {
        proxy_pass http://127.0.0.1:8005;
        include /etc/nginx/wildfire/accounts-proxy.conf;
    }
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8005;
        include /etc/nginx/wildfire/accounts-proxy.conf;
    }
    location = /_accounts_auth {
        internal;
        proxy_pass http://127.0.0.1:8005/internal/auth/active;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-CSRF-Token $http_x_csrf_token;
        proxy_set_header X-Original-Method $accounts_original_method;
    }
    location /api/agent/ {
        include /etc/nginx/wildfire/accounts-protected.conf;
        proxy_pass http://127.0.0.1:8004/;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /api/data-query/ {
        include /etc/nginx/wildfire/accounts-protected.conf;
        proxy_pass http://127.0.0.1:8000/;
    }
    location /api/visualization/ {
        include /etc/nginx/wildfire/accounts-protected.conf;
        proxy_pass http://127.0.0.1:8002/;
    }
    location /api/risk-forecasting/ {
        include /etc/nginx/wildfire/accounts-protected.conf;
        proxy_pass http://127.0.0.1:8001/;
    }
    location / { return 404; }
}
