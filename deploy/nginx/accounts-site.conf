# One HTTPS origin for the signed-in website, /auth/* and /api/* on a single
# host (deploy/SIGN_IN_ONLY.md); the same layout CloudFront gives the AWS
# deployment. Replace accounts.example.org with the public host name.
# tests/accounts/staging_harness.py serves this file, so the browser test runs
# against it.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name accounts.example.org;
    ssl_certificate /etc/letsencrypt/live/accounts.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounts.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # No request logs: callback URLs carry sign-in codes. Errors only at crit,
    # because Nginx error lines quote the request line as well.
    access_log off;
    error_log /var/log/nginx/wildfire-site.error.log crit;
    client_max_body_size 16k;
    root /var/www/wildfire;

    # Nginx drops inherited add_header lines in any location with its own, so
    # every location includes the security headers.
    location /assets/ {
        include /etc/nginx/wildfire/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # Like deploy/cloudfront/site-rewrite.js: page paths load index.html, and
    # API 404s stay 404s because /auth/ and /api/ never reach this location.
    location / {
        include /etc/nginx/wildfire/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
    location /auth/ {
        include /etc/nginx/wildfire/security-headers.conf;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:8080;
    }
    location /api/ {
        include /etc/nginx/wildfire/security-headers.conf;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8080;
    }
}
