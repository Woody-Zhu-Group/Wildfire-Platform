# Shared by every relay server in accounts-relay.conf: verified HTTPS to the
# public API origin, re-resolved as its addresses change.
resolver 127.0.0.53 valid=60s ipv6=off;
resolver_timeout 5s;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $wildfire_api_host;
# Nothing account-specific leaves this host except the verified user id.
proxy_set_header X-CSRF-Token "";
proxy_ssl_server_name on;
proxy_ssl_name $wildfire_api_host;
proxy_ssl_verify on;
proxy_ssl_verify_depth 4;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_connect_timeout 5s;
# The API origin must never set cookies on the signed-in site.
proxy_hide_header Set-Cookie;
