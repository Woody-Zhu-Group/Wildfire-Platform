# Sign-in-only deployment (deploy/SIGN_IN_ONLY.md). This host runs the website,
# the accounts service and the gateway, but not the business services. These
# servers stand in for them on the loopback ports accounts-gateway.conf already
# uses, and forward each request the gateway admitted to the public API origin.
# The gateway has already checked the session and removed Cookie and
# Authorization. Include under Nginx's http context next to
# accounts-gateway.conf; remove this file once the business services run behind
# the gateway on the same host.
#
# The public API origin itself stays reachable without signing in until it is
# closed on AWS. This relay does not change that.

map $host $wildfire_api_host {
    default d3t70p3if3twy3.cloudfront.net;
}

server {
    listen 127.0.0.1:8000;
    server_name _;
    access_log off;
    error_log /var/log/nginx/wildfire-relay.error.log warn;
    location / {
        include /etc/nginx/wildfire/accounts-relay-upstream.conf;
        proxy_read_timeout 90s;
        proxy_pass https://$wildfire_api_host/api/data-query$request_uri;
    }
}

server {
    listen 127.0.0.1:8001;
    server_name _;
    access_log off;
    error_log /var/log/nginx/wildfire-relay.error.log warn;
    location / {
        include /etc/nginx/wildfire/accounts-relay-upstream.conf;
        proxy_read_timeout 90s;
        proxy_pass https://$wildfire_api_host/api/risk-forecasting$request_uri;
    }
}

server {
    listen 127.0.0.1:8002;
    server_name _;
    access_log off;
    error_log /var/log/nginx/wildfire-relay.error.log warn;
    location / {
        include /etc/nginx/wildfire/accounts-relay-upstream.conf;
        proxy_read_timeout 90s;
        proxy_pass https://$wildfire_api_host/api/visualization$request_uri;
    }
}

server {
    listen 127.0.0.1:8004;
    server_name _;
    access_log off;
    error_log /var/log/nginx/wildfire-relay.error.log warn;
    location / {
        include /etc/nginx/wildfire/accounts-relay-upstream.conf;
        # The Ask stream: pass each event on as it arrives.
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass https://$wildfire_api_host/api/agent$request_uri;
    }
}
