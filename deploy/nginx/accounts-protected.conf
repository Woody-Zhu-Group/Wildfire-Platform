# Set only in the original protected location, not at server/subrequest level.
set $accounts_original_method $request_method;
auth_request /_accounts_auth;
auth_request_set $accounts_user $upstream_http_x_account_user_id;
proxy_set_header X-Account-User-Id $accounts_user;
proxy_set_header Host $host;
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_connect_timeout 5s;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Cache-Control;
add_header Cache-Control "no-store" always;
