# Port 80 for the single-host signed-in website (deploy/SIGN_IN_ONLY.md): Let's
# Encrypt HTTP-01 challenges, then a redirect to HTTPS. Replace
# accounts.example.org with the public host name. Install this first, issue the
# certificate, then install accounts-site.conf.
server {
    listen 80;
    listen [::]:80;
    server_name accounts.example.org;
    access_log off;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
